<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новости модов | DC Bots</title>
    <meta name="description" content="Новости о выходе новых модов для Survive the Nights. Бесплатные моды на сайте DC Bots.">
    <meta name="keywords" content="моды для Survive the Nights, новости модов, DC Bots">
    <meta name="author" content="DC Bots">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.dsbot.su/news.html">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%235a67d8'/%3E%3Ctext x='50' y='67' text-anchor='middle' fill='white' font-size='50' font-weight='bold'%3EDC%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .news-section {
            padding: 60px 0;
        }
        .news-grid {
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 900px;
            margin: 0 auto;
        }
        .news-card {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 20px;
            overflow: hidden;
        }
        .news-header {
            padding: 20px 25px 10px 25px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .news-date {
            color: #5a67d8;
            font-size: 14px;
            font-family: monospace;
        }
        .news-category {
            background: #5a67d8;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        .news-title {
            font-size: 24px;
            color: white;
            padding: 0 25px;
            margin: 15px 0 10px 0;
        }
        .news-content {
            padding: 0 25px;
            color: #b0b0b0;
            line-height: 1.7;
        }
        .news-content p {
            margin-bottom: 15px;
        }
        .download-links {
            background: #0f0f0f;
            padding: 15px 25px;
            margin-top: 20px;
            border-top: 1px solid #2a2a2a;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .download-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #5a67d8;
            text-decoration: none;
            font-size: 14px;
        }
        .download-link:hover {
            text-decoration: underline;
        }
        .hero h1 {
            color: white !important;
            background: none !important;
            -webkit-background-clip: unset !important;
            background-clip: unset !important;
        }
        .btn-idea {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 1px solid #5a67d8;
            color: #5a67d8;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-idea:hover {
            background: #5a67d8;
            color: white;
            transform: translateY(-2px);
        }
        .idea-button-wrapper {
            max-width: 900px;
            margin: 0 auto 20px auto;
            text-align: right;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: #141414;
            margin: 10% auto;
            padding: 0;
            width: 90%;
            max-width: 500px;
            border-radius: 20px;
            border: 1px solid #2a2a2a;
        }
        .modal-header {
            padding: 20px 25px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            border-radius: 20px 20px 0 0;
        }
        .modal-header h2 {
            color: #e0e0e0;
            font-size: 22px;
            font-weight: 600;
        }
        .modal-header h2 span { color: #5a67d8; }
        .close-modal {
            color: #888;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-modal:hover { color: #e53e3e; }
        .modal-body {
            padding: 25px;
            background: #141414;
        }
        .modal-body input,
        .modal-body textarea {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 15px;
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            color: #e0e0e0;
        }
        .modal-body textarea {
            min-height: 120px;
        }
        .modal-body button {
            width: 100%;
            background: #5a67d8;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            .news-title { font-size: 20px; }
            .idea-button-wrapper { text-align: center; }
        }
    </style>
</head>
<body>
    <div class="loader-wrapper" id="loader">
        <div class="loader">
            <div class="loader-logo">📰</div>
            <div class="loader-text">DC Bots</div>
            <div class="loader-dots">
                <div class="loader-dot"></div>
                <div class="loader-dot"></div>
                <div class="loader-dot"></div>
            </div>
        </div>
    </div>
    <script>
        window.addEventListener('load', function() {
            const loader = document.getElementById('loader');
            loader.classList.add('hide');
            setTimeout(() => { loader.remove(); }, 500);
        });
    </script>

    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo">DC<span>Bots</span></a>
            <div class="nav">
                <a href="index.html">Главная</a>
                <a href="dungeon-crusher.html">Dungeon Crusher</a>
                <a href="avito-bot.html">Avito Bot</a>
                <a href="universal-macro.html">Universal Macro</a>
                <a href="news.html">Новости</a>
                <a href="support.html">Поддержка</a>
                <a href="partners.html">Партнерам</a>
                <a href="https://t.me/alibobao" target="_blank">Telegram</a>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1>Новости модов</h1>
            <p>Анонсы и выход новых модов для игр</p>
        </div>
    </section>

    <section class="news-section">
        <div class="container">
            <div class="idea-button-wrapper">
                <button class="btn-idea" id="openModalBtn">💡 Предложить идею мода</button>
            </div>
            <div id="newsContainer" class="news-grid">
                <div class="loader-news">📡 Загрузка...</div>
            </div>
        </div>
    </section>

    <div id="ideaModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>💡 <span>Предложить идею мода</span></h2>
                <span class="close-modal">&times;</span>
            </div>
            <div class="modal-body">
                <form action="https://formsubmit.co/cheltypo@gmail.com" method="POST" id="ideaForm">
                    <input type="hidden" name="_subject" value="💡 Новая идея мода с сайта DC Bots">
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_template" value="box">
                    <input type="hidden" name="_autoresponse" value="Спасибо за идею! Мы её рассмотрим.">
                    <input type="text" name="name" placeholder="Ваше имя" required>
                    <input type="email" name="email" placeholder="Ваш email" required>
                    <textarea name="message" placeholder="Опишите идею мода..." required></textarea>
                    <button type="submit">📩 Отправить</button>
                </form>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>© 2026 DC Bots. Бесплатные моды для игр.</p>
            <p style="margin-top: 10px;">
                <a href="index.html">Главная</a> |
                <a href="news.html">Новости</a> |
                <a href="support.html">Поддержка</a> |
                <a href="https://t.me/alibobao">Telegram</a>
            </p>
        </div>
    </footer>

    <script>
        async function loadNews() {
            const container = document.getElementById('newsContainer');
            try {
                const response = await fetch('data/news.json');
                const news = await response.json();
                if (!news.length) {
                    container.innerHTML = '<div class="no-news">Новостей пока нет</div>';
                    return;
                }
                container.innerHTML = news.map(item => `
                    <div class="news-card">
                        <div class="news-header">
                            <span class="news-date">📅 ${item.date}</span>
                            <span class="news-category">${item.category}</span>
                        </div>
                        <h2 class="news-title">${item.title}</h2>
                        <div class="news-content">
                            <p>${item.description}</p>
                            ${item.text ? `<p>${item.text}</p>` : ''}
                        </div>
                        ${item.links ? `
                            <div class="download-links">
                                ${item.links.steam ? `<a href="${item.links.steam}" target="_blank" class="download-link">🎮 Steam Workshop →</a>` : ''}
                                ${item.links.direct ? `<a href="${item.links.direct}" target="_blank" class="download-link">📥 Прямая ссылка →</a>` : ''}
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = '<div class="no-news">Не удалось загрузить новости</div>';
            }
        }
        loadNews();

        const modal = document.getElementById('ideaModal');
        const openBtn = document.getElementById('openModalBtn');
        const closeBtn = document.querySelector('.close-modal');
        if (openBtn) openBtn.onclick = () => { modal.style.display = 'block'; document.body.style.overflow = 'hidden'; };
        if (closeBtn) closeBtn.onclick = () => { modal.style.display = 'none'; document.body.style.overflow = 'auto'; };
        window.onclick = (event) => { if (event.target == modal) { modal.style.display = 'none'; document.body.style.overflow = 'auto'; } };
    </script>
</body>
</html>
